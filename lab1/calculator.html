<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="calculator_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-ticket">
            <div class="ticket-image calculator-display">
                <div id="result" class="result-display">0</div>
            </div>

            <div class="ticket-info calculator-info">
                <div class="ticket-date">
                    <span>CALC</span>
                    <div class="line"></div>
                    <span>2026</span>
                </div>

                <div class="ticket-dots"></div>

                <div class="calculator-buttons">
                    <div class="button-row">
                        <button id="btn_op_clear" class="calc-btn secondary">C</button>
                        <button id="btn_op_sign" class="calc-btn secondary">+/-</button>
                        <button id="btn_op_percent" class="calc-btn secondary">%</button>
                        <button id="btn_op_back" class="calc-btn secondary">←</button>
                    </div>

                    <div class="button-row">
                        <button id="btn_digit_7" class="calc-btn">7</button>
                        <button id="btn_digit_8" class="calc-btn">8</button>
                        <button id="btn_digit_9" class="calc-btn">9</button>
                        <button id="btn_op_div" class="calc-btn primary">/</button>
                    </div>

                    <div class="button-row">
                        <button id="btn_digit_4" class="calc-btn">4</button>
                        <button id="btn_digit_5" class="calc-btn">5</button>
                        <button id="btn_digit_6" class="calc-btn">6</button>
                        <button id="btn_op_mult" class="calc-btn primary">×</button>
                    </div>

                    <div class="button-row">
                        <button id="btn_digit_1" class="calc-btn">1</button>
                        <button id="btn_digit_2" class="calc-btn">2</button>
                        <button id="btn_digit_3" class="calc-btn">3</button>
                        <button id="btn_op_minus" class="calc-btn primary">−</button>
                    </div>

                    <div class="button-row">
                        <button id="btn_digit_dot" class="calc-btn">.</button>
                        <button id="btn_digit_0" class="calc-btn">0</button>
                        <button id="btn_op_equal" class="calc-btn primary execute">=</button>
                        <button id="btn_op_plus" class="calc-btn primary">+</button>

                    </div>

                    <div class="button-row">
                        <button id="btn_op_sqrt" class="calc-btn primary">√</button>
                        <button id="btn_op_square" class="calc-btn primary">x²</button>
                        <button id="btn_op_factorial" class="calc-btn primary">x!</button>
                        <button id="btn_op_personal" class="calc-btn primary">✨</button>
                    </div>

                    <div class="button-row">
                        <button id="btn_op_memory_add" class="calc-btn secondary">M+</button>
                        <button id="btn_op_memory_sub" class="calc-btn secondary">M-</button>
                        <button id="btn_op_000" class="calc-btn secondary">000</button>
                        <button id="btn_op_color" class="calc-btn secondary">🎨</button>
                    </div>
                </div>

                <div class="ticket-bottom">
                    <div class="ticket-barcode"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="calculator_script.js"></script>
</body>
</html>
